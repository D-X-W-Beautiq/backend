version: '3.8'

services:
  # --- 1. Nginx 프록시 서비스 (새로 추가됨) ---
  nginx:
    image: nginx:latest
    container_name: nginx-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # (이 파일은 'certbot' 실행 후 만들어야 합니다)
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      # (이 폴더는 'certbot' 실행 후 생성됩니다)
      - /etc/letsencrypt:/etc/letsencrypt
    networks:
      - beautiq-network
    restart: always
    depends_on:
      - beautiq

  # --- 2. Beautiq 앱 서비스 (기존 내용을 수정한 것) ---
  beautiq:
    build: .
    container_name: beautiq-app
    # (ports: 항목 삭제됨 -> Nginx가 대신 처리)

    # (디버그 모드 실행을 위해 'command:' 추가됨)
    command: ["--debug"]

    # (중요!) .env 파일을 그대로 사용하도록 설정되어 있습니다.
    env_file:
      - .env

    restart: always
    networks:
      - beautiq-network

# --- 두 컨테이너가 소통할 네트워크 ---
networks:
  beautiq-network:
    driver: bridge