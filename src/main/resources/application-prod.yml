spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  security:
    oauth2:
      client:
        registration:
          google:
            redirect-uri: ${BASE_URL}/login/oauth2/code/{registrationId}
          kakao:
            redirect-uri: ${BASE_URL}/login/oauth2/code/{registrationId}

app:
  openapi:
    enabled: ${SWAGGER_ENABLED:false}
  oauth2:
    redirect: ${OAUTH_REDIRECT}
    cookie-domain: ${COOKIE_DOMAIN}
    use-cookie-secure: ${COOKIE_SECURE:true}
    allowed-origin: ${FRONTEND_ORIGIN}
  auth:
    dev-login-page-enabled: ${DEV_LOGIN_PAGE_ENABLED:false}
  ai-server:
    url: ${AI_SERVER_URL}
    connect-timeout-ms: ${AI_CONNECT_TIMEOUT_MS:5000}
    response-timeout-seconds: ${AI_RESPONSE_TIMEOUT_SECONDS:180}
    read-timeout-seconds: ${AI_READ_TIMEOUT_SECONDS:180}
    write-timeout-seconds: ${AI_WRITE_TIMEOUT_SECONDS:60}
    max-in-memory-mb: ${AI_MAX_IN_MEMORY_MB:50}
  product:
    init:
      enabled: ${PRODUCT_INIT_ENABLED:true}

swagger:
  server:
    url: ${SWAGGER_SERVER_URL}
    description: Production Server

