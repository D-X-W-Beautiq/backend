spring:
#  profiles:
#    active: mock-ai  # AI Mock 클라이언트 사용 (개발/테스트용)
  config:
    import: optional:file:.env[.properties]

  cloud:
    aws:
      credentials:
        access-key: ${AWS_ACCESS_KEY_ID}
        secret-key: ${AWS_SECRET_ACCESS_KEY}
      region:
        static: ${AWS_REGION}
      s3:
        bucket: ${S3_BUCKET}

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false  # SQL 로그 비활성화
    properties:
      hibernate:
        format_sql: false  # SQL 포맷팅도 비활성화
        dialect: org.hibernate.dialect.MySQL8Dialect

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - email
              - profile
            redirect-uri: ${BASE_URL}/login/oauth2/code/{registrationId}
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: ${BASE_URL}/login/oauth2/code/{registrationId}
            scope:
              - profile_nickname
              - profile_image
            client-name: kakao
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

jwt:
  secret: ${JWT_SECRET}

app:
  openapi:
    title: Beautiq Swagger
    description: Beautiq REST API
    version: ${spring.application.version:0.0.1-SNAPSHOT}
  oauth2:
    redirect: ${OAUTH_REDIRECT}
    cookie-domain: ${COOKIE_DOMAIN}
    use-cookie-secure: ${COOKIE_SECURE}
    allowed-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
  ai-server:
    url: ${AI_SERVER_URL}
    connect-timeout-ms: 10000
    response-timeout-seconds: 180  # 3분
    read-timeout-seconds: 180      # 3분
    write-timeout-seconds: 60      # 1분
    max-in-memory-mb: 50           # Base64 이미지 처리를 위한 메모리 제한
  s3:
    enabled: true

  product:
    init:
      enabled: true  # false로 설정하면 초기 로드 비활성화
      file: classpath:oliveyoung_data_set.xlsx

# Swagger UI 설정
springdoc:
  swagger-ui:
    with-credentials: true
    csrf:
      enabled: false

# AWS SDK v1 deprecation 경고 비활성화
aws:
  java:
    v1:
      disableDeprecationAnnouncement: true


openapi: 3.0.3
info:
  title: Demo API
  version: 1.0.0

servers:
  - url: https://localhost:8080

paths:
  /users/me:
    get:
      summary: 내 정보 보기
      security:
        - BearerAuth: []   # <- 여기에 인증 적용
      responses:
        "200":
          description: 성공
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
security:
  - BearerAuth: []   # <- 전역 설정 (원하면 생략 가능)