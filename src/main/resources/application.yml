# ======================================
# Beautiq Backend Application Config
# ======================================
# 모든 환경(개발/프로덕션)을 .env 파일로 관리
# application-dev.yml, application-prod.yml 불필요
# ======================================

spring:
  application:
    name: Beautiq

  # .env 파일 자동 로드
  config:
    import: optional:file:.env[.properties]

  # 리버스 프록시 헤더 처리 (HTTPS 환경에서 필수)
  # Nginx, ALB 등이 전달하는 X-Forwarded-Proto, X-Forwarded-Host 등을 인식
  mvc:
    forward-headers-strategy: framework

  # ===== Database =====
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # ===== JPA/Hibernate =====
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}  # dev: update, prod: validate
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: ${JPA_FORMAT_SQL:false}
        dialect: org.hibernate.dialect.MySQL8Dialect

  # ===== AWS =====
  cloud:
    aws:
      credentials:
        access-key: ${AWS_ACCESS_KEY_ID}
        secret-key: ${AWS_SECRET_ACCESS_KEY}
      region:
        static: ${AWS_REGION:ap-northeast-2}
      s3:
        bucket: ${S3_BUCKET}

  # ===== OAuth2 =====
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - email
              - profile
            redirect-uri: "${app.base-url}/login/oauth2/code/{registrationId}"
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "${app.base-url}/login/oauth2/code/{registrationId}"
            scope:
              - profile_nickname
              - profile_image
              - account_email
            client-name: kakao
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

  # ===== Multipart =====
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

server:
  tomcat:
    max-http-form-post-size: 100MB

# ===== JWT =====
jwt:
  secret: ${JWT_SECRET}

# ===== Application Custom Config =====
app:
  # 백엔드(서버) base URL: OAuth2 redirect_uri 생성 시 사용됩니다.
  # 개발: http://localhost:8080
  # 프로덕션: https://api.beautiq.my
  base-url: ${APP_BASE_URL:http://localhost:8080}

  # 프론트엔드
  frontend:
    origin: ${FRONTEND_ORIGIN:http://localhost:5173}

  # OAuth2
  oauth2:
    redirect: ${OAUTH2_REDIRECT_URL:http://localhost:5173/oauth/callback}
    cookie:
      domain: ${COOKIE_DOMAIN:}  # 빈 값이면 현재 도메인만, .beautiq.my면 서브도메인 공유
      secure: ${COOKIE_SECURE:false}  # HTTPS 환경에서는 true

  # AI 서버
  ai-server:
    url: ${AI_SERVER_URL:http://localhost:5000}
    connect-timeout-ms: ${AI_CONNECT_TIMEOUT_MS:10000}
    response-timeout-seconds: ${AI_RESPONSE_TIMEOUT_SECONDS:180}
    read-timeout-seconds: ${AI_READ_TIMEOUT_SECONDS:180}
    write-timeout-seconds: ${AI_WRITE_TIMEOUT_SECONDS:60}
    max-in-memory-mb: ${AI_MAX_IN_MEMORY_MB:50}

  # S3
  s3:
    enabled: ${S3_ENABLED:true}

  # 제품 초기화
  product:
    init:
      enabled: ${PRODUCT_INIT_ENABLED:true}
      file: ${PRODUCT_INIT_FILE:classpath:oliveyoung_data_set.xlsx}

  # 개발 로그인 페이지
  auth:
    dev-login-page-enabled: ${DEV_LOGIN_PAGE_ENABLED:true}

  # Swagger/OpenAPI
  swagger:
    enabled: ${SWAGGER_ENABLED:true}
    server:
      url: ${SWAGGER_SERVER_URL:http://localhost:8080}
      description: ${SWAGGER_SERVER_DESC:Development Server}

# ===== Swagger UI =====
springdoc:
  swagger-ui:
    with-credentials: true
    csrf:
      enabled: false
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

# ===== AWS SDK =====
aws:
  java:
    v1:
      disableDeprecationAnnouncement: true

# ===== Logging =====
# AWS SDK 로그 레벨 조정, 임시 조치이므로 25년도 내로 v2로 마이그레이션 필수
logging:
  level:
    com.amazonaws: ERROR
    software.amazon.awssdk: ERROR
    com.amazonaws.util: ERROR
