spring:
  config:
    import: optional:file:.env[.properties]



  datasource:
    url: jdbc:mysql://localhost:3306/Beautiq?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:jws6382!}

    driver-class-name: com.mysql.cj.jdbc.Driver

    jpa:
      open-in-view: false
      hibernate:
        ddl-auto: update
      show-sql: true
      properties:
        hibernate:
          format_sql: true
          dialect: org.hibernate.dialect.MySQL8Dialect



  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - email
              - profile
            redirect-uri: "https://getpostman.com/oauth2/callback"
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "https://getpostman.com/oauth2/callback"
            scope: # 카카오에서 이메일 받으려면 동의항목 활성화 필요
              - profile_nickname
            client-name: Kakao
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id  # 카카오의 고유 키
jwt:
  secret: "변경필수_길고_랜덤한_서명키"
  access-exp-min: 15
  refresh-exp-days: 14
app:
  oauth2:
    redirect-success: "http://localhost:3000/login/callback" # 로그인 성공시 프론트로 이동
    cookie-domain: "localhost"
    use-cookie-secure: false # HTTPS면 true


